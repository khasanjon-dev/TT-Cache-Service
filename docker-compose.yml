services:
  cache-service:
    build: .
    ports:
      - "8000:8000"
    environment:
      CACHE_DATABASE_URL: postgresql+psycopg://cache_user:${POSTGRES_PASSWORD:-cache_user_dev}@postgres:5432/cache_db
      WEB_CONCURRENCY: "2"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: cache_db
      POSTGRES_USER: cache_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cache_user_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
